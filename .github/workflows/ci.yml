name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION_DEFAULT: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra redis

      - name: Check code style with ruff
        run: uv run ruff check src/ tests/

      - name: Check formatting with ruff
        run: uv run ruff format --check src/ tests/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies (including optional extras for type stubs)
        run: uv sync --extra dev --extra full

      - name: Run mypy
        run: uv run mypy src/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run bandit security scan
        run: uv run bandit -r src/

      - name: Export runtime dependency manifest
        # Audit what users actually install (pyproject runtime + published
        # extras), not the dev/test toolchain. CVEs in pytest, pip, uv,
        # etc. don't ship in the wheel.
        run: |
          uv export --no-dev --extra redis --extra metrics \
            --format requirements-txt --no-emit-project --no-hashes \
            > runtime-requirements.txt

      - name: Run pip-audit on runtime dependencies
        run: uv run pip-audit --no-deps --disable-pip -r runtime-requirements.txt

  package:
    name: Build & verify wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel

      - name: Verify Lua scripts are packaged in the wheel
        # A packaging regression that drops the Lua data files would
        # otherwise ship to PyPI undetected.
        run: |
          WHEEL=$(ls dist/*.whl)
          echo "Inspecting $WHEEL"
          LUA_COUNT=$(unzip -l "$WHEEL" | grep -c '\.lua$' || true)
          echo "Lua files in wheel: $LUA_COUNT"
          if [ "$LUA_COUNT" -ne 6 ]; then
            echo "::error::Expected 6 Lua scripts in the wheel, found $LUA_COUNT"
            exit 1
          fi

      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --upgrade pip
          /tmp/wheeltest/bin/pip install "$(ls dist/*.whl)[redis]"

      - name: Smoke-test the installed wheel
        run: |
          /tmp/wheeltest/bin/python - <<'PY'
          from importlib.resources import files

          import adaptive_rate_limiter as arl
          from adaptive_rate_limiter.backends import RedisBackend  # noqa: F401

          lua_dir = files("adaptive_rate_limiter.backends") / "lua"
          scripts = sorted(
              p.name for p in lua_dir.iterdir() if p.name.endswith(".lua")
          )
          assert len(scripts) == 6, scripts
          print("version:", arl.__version__)
          print("lua scripts:", scripts)
          PY

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra redis

      - name: Run unit tests only (Windows)
        if: runner.os == 'Windows'
        run: uv run pytest tests/unit/ --cov=src/adaptive_rate_limiter --cov-report=xml --cov-report=term-missing

      - name: Run full test suite (Ubuntu/macOS)
        if: runner.os != 'Windows'
        run: uv run pytest --cov=src/adaptive_rate_limiter --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests-py${{ matrix.python-version }}-${{ matrix.os }}
          name: codecov-py${{ matrix.python-version }}-${{ matrix.os }}
          fail_ci_if_error: false
          verbose: true

  test-redis-integration:
    name: Integration Tests (Real Redis, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra redis

      - name: Run full test suite against real Redis
        env:
          REDIS_URL: redis://localhost:6379
        run: uv run pytest --cov=src/adaptive_rate_limiter --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: redis-integration-py${{ matrix.python-version }}
          name: codecov-redis-integration-py${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true
